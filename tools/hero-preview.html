<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Quatro personagens — sequências e transições</title>
<style>body{background:#242830;color:#efdbb4;font:15px monospace;margin:20px}canvas{image-rendering:pixelated;max-width:100%;height:auto}button{font:inherit;padding:8px}a{color:#deb67b}</style>
<p>Quatro personagens × oito direções. Em cada grupo: repouso, caminhada, ataque e transição automática (anda → ataca → anda → para). Linha verde: apoio dos pés. Espaço: pausar.</p>
<button id="pause">Pausar</button> <a href="../index.html">Abrir jogo</a><p id="status">Carregando…</p><canvas width="1536" height="1376"></canvas>
<script src="../js/hero_sprite.js"></script>
<script src="../assets/characters/nopal/atlas.js?v=attack-zip-2"></script><script src="../js/nopal_sprite.js?v=attack-zip-2"></script>
<script src="../assets/characters/rosa/atlas.js?v=attack-zip-2"></script><script src="../js/rosa_sprite.js?v=attack-zip-2"></script>
<script src="../assets/characters/bento/atlas.js?v=attack-zip-2"></script><script src="../js/bento_sprite.js?v=attack-zip-2"></script>
<script src="../assets/characters/iris/atlas.js?v=attack-zip-2"></script><script src="../js/iris_sprite.js?v=attack-zip-2"></script>
<script>
const sprites=[NopalSprite,RosaSprite,BentoSprite,IrisSprite],ids=['nopal','rosa','bento','iris'],g=document.querySelector('canvas').getContext('2d');let time=0,previous=0,paused=false;
function toggle(){paused=!paused;document.querySelector('button').textContent=paused?'Continuar':'Pausar'}
document.querySelector('button').onclick=toggle;onkeydown=e=>{if(e.code==='Space'){e.preventDefault();toggle()}};
function paint(now){if(!paused)time+=Math.min(.05,(now-previous)/1000);previous=now;
 g.fillStyle='#242830';g.fillRect(0,0,1536,1376);g.font='14px monospace';
 const ready=sprites.every(s=>s.status().ready);document.querySelector('#status').textContent=ready?'48 quadros de caminhada + 32 quadros de ataque por personagem. Sem espelhamento.':'Carregando…';
 sprites.forEach((s,i)=>{for(let dir=0;dir<8;dir++){
  const x=(dir%4)*384,y=i*344+Math.floor(dir/4)*164;g.fillStyle='#efdbb4';g.fillText(ids[i]+' / '+['↓','↙','←','↖','↑','↗','→','↘'][dir],x+12,y+18);
  for(let mode=0;mode<4;mode++){
   const cx=x+44+mode*94,cy=y+105,phase=time%2.8;
   const p={characterId:ids[i],visualDirection:dir,visualMoving:mode===1||mode===3&&phase<2.1,visualWalkTime:time,invuln:0};
   if(mode===2){p.heroAttackAt=time-(time%.65);p.heroAttackAngle=Math.PI/2+dir*Math.PI/4}
   if(mode===3){p.heroAttackAt=time-phase+.7;p.heroAttackAngle=Math.PI/2+dir*Math.PI/4}
   g.fillStyle='#527354';g.fillRect(cx-38,cy+22,76,1);s.draw(g,p,cx,cy,time);
   g.fillStyle='#baa98b';g.fillText(['parado','andando','ataque','transição'][mode],cx-35,y+151);
  }
 }});requestAnimationFrame(paint)
}requestAnimationFrame(paint);
</script></html>
